<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Front Cover -->
        <section class="cover" id="cover">

            <div class="envelope">

                <img
                    src="img/photo_2026-09-20_19-16-30.jpg"
                    alt="Birthday love letter for Abdulazeez Amope Nasroh"
                >

                <button id="openButton">
                    Open My Letter ❤️
                </button>

            </div>

        </section>


        <!-- Letter -->
        <section class="letter" id="letter">

            <div class="paper">

                <img
                    src="img/photo_2026-09-20_19-16-37.jpg"
                    alt="Handwritten birthday love letter"
                >

                <button id="closeButton">
                    Close Letter 💌
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
